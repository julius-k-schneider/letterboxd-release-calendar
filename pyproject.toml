[project]
name = "letterboxd-release-calendar"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.3",
    "django-environ>=0.11",
    "letterboxdpy>=4.7",
    "requests>=2.31",
    "gunicorn>=22.0",
    "whitenoise>=6.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
